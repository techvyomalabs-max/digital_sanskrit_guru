# /etc/nginx/sites-available/ecommerce — Digital Sanskrit Guru on AWS Lightsail
#
# Install:
#   sudo cp deployment/nginx-ecommerce.conf /etc/nginx/sites-available/ecommerce
#   sudo nginx -t && sudo systemctl reload nginx
#
# After the domain points at this server, run certbot (see the deployment guide);
# it adds the HTTPS server block and the HTTP -> HTTPS redirect to this file.

server {
    listen 80;
    server_name _;   # replace with: digitalsanskritguru.com www.digitalsanskritguru.com

    root /var/www/ecommerce/dist;
    server_tokens off;   # don't advertise the nginx version

    # ── Compression ──────────────────────────────────────────────────────────
    # Ubuntu's default nginx only compresses text/html, so JS/CSS/JSON were being
    # sent uncompressed (the 1 MB main bundle went out at full size).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        application/manifest+json image/svg+xml font/ttf font/otf;

    # ── Caching ──────────────────────────────────────────────────────────────
    # Vite puts a content hash in every file name under /assets/, so a file
    # there never changes in place and can be cached for a year.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Images, icons and fonts from /public (logo.png…) keep their names
    # between deploys, so cache them for a week and let the browser revalidate.
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Pages go to Express, not straight to index.html. Express adds each page's
    # canonical link, robots and share tags, sends the 301 redirects for old
    # WordPress links and old product links, and answers unknown products with a
    # real 404. Files that exist in dist (sw.js, the catalogue PDF…) are still
    # served by nginx. Express sends "Cache-Control: no-cache" on pages, so a
    # deploy never leaves visitors on an old page that points at deleted /assets/.
    location = / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        try_files $uri @storefront;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @storefront {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt and sitemap.xml are generated by Express (from SITE_URL and the
    # live catalog).
    location = /robots.txt {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── API → Node.js (PM2) on port 5001 ─────────────────────────────────────
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
