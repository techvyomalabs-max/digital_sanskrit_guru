    <circle cx="1210" cy="250" r="1.5" opacity="0.8"/><circle cx="1500" cy="320" r="1.2" opacity="0.6"/>
    <circle cx="260" cy="380" r="1.1" opacity="0.5"/><circle cx="620" cy="420" r="1.4" opacity="0.7"/>
    <circle cx="960" cy="360" r="1" opacity="0.5"/><circle cx="1380" cy="480" r="1.3" opacity="0.6"/>
    <circle cx="180" cy="560" r="1" opacity="0.4"/><circle cx="1100" cy="560" r="1.2" opacity="0.5"/>
  </g>
  <g fill="#5b7bbf" filter="url(#soft)" opacity="0.25">
    <ellipse cx="400" cy="760" rx="420" ry="70"/><ellipse cx="1250" cy="840" rx="380" ry="60"/>
  </g>
