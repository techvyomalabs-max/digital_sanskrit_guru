<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0d1b3a"/>
      <stop offset="1" stop-color="#1c2f5a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.82" cy="0.14" r="0.25">
      <stop offset="0" stop-color="#dbe7ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#dbe7ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#moon)"/>
  <g fill="#ffffff">
