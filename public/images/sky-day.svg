<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa9e6"/>
      <stop offset="0.45" stop-color="#9fd0f5"/>
      <stop offset="0.8" stop-color="#d9eefc"/>
      <stop offset="1" stop-color="#f2f8fd"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.12" r="0.35">
      <stop offset="0" stop-color="#fff8e1" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#fff3c4" stop-opacity="0.35"/>
