    <!-- Google Tag Manager and Consent Mode v2 Setup (GDPR & DPDP Act 2023 Compliant) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      // Fetch stored consent preferences or default to denied
      window.dsgConsentSettings = { analytics: false, marketing: false };
      try {
        const storedConsent = localStorage.getItem("dsg-cookie-consent");
        if (storedConsent) {
          window.dsgConsentSettings = JSON.parse(storedConsent);
        }
      } catch (e) {}

      gtag('consent', 'default', {
        'analytics_storage': window.dsgConsentSettings.analytics ? 'granted' : 'denied',
        'ad_storage': window.dsgConsentSettings.marketing ? 'granted' : 'denied',
        'ad_user_data': window.dsgConsentSettings.marketing ? 'granted' : 'denied',
        'ad_personalization': window.dsgConsentSettings.marketing ? 'granted' : 'denied',
        'security_storage': 'granted' // Necessary cookies are always granted
      });
    </script>
    <!-- Immediate site theme pre-restore and fast fetch for new browsers -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem("site-theme-settings");
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.siteTheme) {
              document.documentElement.setAttribute("data-site-theme", parsed.siteTheme);
              return;
            }
          }
          document.documentElement.setAttribute("data-site-theme", "sky-blue");
          fetch("/api/settings/public")
            .then(function(r) { return r.json(); })
            .then(function(d) {
              if (d && d.siteTheme) {
                document.documentElement.setAttribute("data-site-theme", d.siteTheme);
                try {
                  localStorage.setItem("site-theme-settings", JSON.stringify({
                    siteTheme: d.siteTheme,
                    customThemes: Array.isArray(d.customThemes) ? d.customThemes : []
                  }));
                } catch(e) {}
              }
            })
            .catch(function() {});
        } catch(e) {
          document.documentElement.setAttribute("data-site-theme", "sky-blue");
        }
      })();
    </script>
